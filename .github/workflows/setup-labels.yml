name: Setup labels

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-labels:
    name: Crear labels del workflow de triage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear labels que falten
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "status:needs-triage", color: "fbca04", description: "Issue sin asignar, esperando triage o /claim" },
              { name: "status:claimed",      color: "0e8a16", description: "Asignada via /claim, lock activo" },
              { name: "status:blocked",      color: "d93f0b", description: "Asignada pero bloqueada por algo externo" },
              { name: "status:done",         color: "6f42c1", description: "Cerrada via PR mergeada - sello historico, no se quita" },
              { name: "priority:p0",        color: "b60205", description: "Bloquea release - urgente" },
              { name: "priority:p1",        color: "d93f0b", description: "Sprint actual - importante" },
              { name: "priority:p2",        color: "fbca04", description: "Backlog - nice to have" },
              { name: "type:feature",       color: "0052cc", description: "Funcionalidad nueva" },
              { name: "type:refactor",      color: "0052cc", description: "Refactor sin cambio funcional" },
              { name: "type:chore",         color: "0052cc", description: "Mantenimiento, deps, housekeeping" },
              { name: "area:auth",          color: "7057ff", description: "src/modules/auth/ - login, JWT" },
              { name: "area:users",         color: "7057ff", description: "src/modules/users/ - cuentas y roles" },
              { name: "area:property",      color: "7057ff", description: "src/modules/property/ - entidad central" },
              { name: "area:installation",  color: "7057ff", description: "src/modules/installation/" },
              { name: "area:classification",color: "7057ff", description: "src/modules/classification/" },
              { name: "area:insurance-record", color: "7057ff", description: "src/modules/insurance-record/" },
              { name: "area:plan-record",   color: "7057ff", description: "src/modules/plan-record/" },
              { name: "area:rented-record", color: "7057ff", description: "src/modules/rented-record/" },
              { name: "area:writing-record",color: "7057ff", description: "src/modules/writing-record/" },
              { name: "area:notification",  color: "7057ff", description: "src/modules/notification/ - notificaciones y cron" },
              { name: "area:devops",        color: "7057ff", description: "CI / deploy / infraestructura" },
              { name: "triage:rotating",    color: "5319e7", description: "Esperando decision del PO de la semana" },
              { name: "triage-rota",        color: "c5def5", description: "Label interno: marca la issue pinneada que es la fuente de verdad de la rotacion" },
            ];

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const byName = new Map(existing.map(l => [l.name, l]));
            const results = { created: [], updated: [], failed: [] };

            for (const l of labels) {
              try {
                if (byName.has(l.name)) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: l.name, color: l.color, description: l.description,
                  });
                  results.updated.push(l.name);
                } else {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: l.name, color: l.color, description: l.description,
                  });
                  results.created.push(l.name);
                }
              } catch (e) {
                results.failed.push(`${l.name}: ${e.message}`);
              }
            }
            await core.summary
              .addRaw('## Setup labels\n\n')
              .addRaw('```json\n' + JSON.stringify(results, null, 2) + '\n```\n')
              .write();
